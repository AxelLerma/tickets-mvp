services:
  db:
    image: postgres:15-alpine
    container_name: tickets-db
    ports:
      - "127.0.0.1:5432:5432"
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - tickets_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tickets-backend
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_DIR: /app/storage
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      TICKET_COOLDOWN_SEG: ${TICKET_COOLDOWN_SEG}
      TICKETS_POR_HORA: ${TICKETS_POR_HORA}
      CAPACIDAD_BALANCEADO: ${CAPACIDAD_BALANCEADO}
      CAPACIDAD_SATURADO: ${CAPACIDAD_SATURADO}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - tickets_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL}
    container_name: tickets-frontend
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      FRONTEND_URL: ${FRONTEND_URL}
      NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL}
      API_URL: ${API_URL}
    depends_on:
      - backend

volumes:
  tickets_db_data:
  tickets_storage: